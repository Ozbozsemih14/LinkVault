<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault | Kişisel Arşiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-gray-900 text-gray-100 min h-screen font-sans">
    <div class="container mx-auto px-4 py-10 max-w-3xl">
      <header class="text-center mb-11">
        <h1 class="text-4xl font-bold text-blue-500 mb-2 tracking-tight">
          LinkVault
        </h1>
        <p class="text-gray-100">Önemli linklerini burada kaydet.</p>
      </header>
      <div
        class="bg-gray-800 p-6 rounded-2xl shadow-lg mb-10 border border-gray-700"
      >
        <div class="flex flex-col space-y-4">
          <input
            id="titleInput"
            type="text"
            placeholder="Link Başlığı (Örn: Google)"
            class="bg-gray-700 border-none rounded-lg p-3 focus:ring-2 focus:ring-blue-300 outline-none text-white"
          />

          <input
            id="urlInput"
            type="url"
            placeholder="URL adresi (https://...)"
            class="bg-gray-700 border-none rounded-lg p-3 focus:ring-2 focus:ring-blue-300 outline-none text-white"
          />

          <button
            onclick="addLink()"
            class="text-white bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 shadow-lg shadow-blue-500/50 dark:shadow-lg dark:shadow-blue-800/80 font-medium rounded-base text-sm px-4 py-2.5 text center leading-5"
          >
            Linki Kaydet
          </button>
        </div>
      </div>

      <div id="linkList" class="space-y-4">
        <div
          class="bg-gray-800 p-4 rounded-xl flex justify-between items-center border border-gray-700 hover:border-blue-500 transition duration-500 shadow-md"
        >
          <div class="flex flex-col">
            <h3 class="text-lg font-bold text-white">Google</h3>
            <a
              href="https://google.com"
              target="_blank"
              class="text_blue-400 text-sm hover:underline"
              >https://google.com</a
            >
          </div>
          <button class="text-gray-300 hover:text-red-500 transition p-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
              />
            </svg>
          </button>
        </div>

        <p class="text-center text-gray-300 italic">Linkler Yükleniyor...</p>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
